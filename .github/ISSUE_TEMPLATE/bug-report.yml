name: Bug report
description: Something gave a wrong, invented or missing result
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: asked
    attributes:
      label: What you asked
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What you got, and what you expected
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where you ran it
      options:
        - Claude app (claude.ai or desktop)
        - Claude Cowork
        - Claude Code
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please do not paste your resume or personal details here.
